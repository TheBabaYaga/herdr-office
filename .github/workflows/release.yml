name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  please:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: rp

  linux:
    needs: please
    if: needs.please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HERDR_OFFICE_VERSION: ${{ needs.please.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm test
      - name: Check install.sh
        run: |
          command -v shellcheck || sudo apt-get install -y shellcheck
          shellcheck install.sh
      - run: npm run build
      - name: Smoke test the binary
        run: |
          HERDR_OFFICE_NO_OPEN=1 HERDR_SOCKET_PATH=/tmp/none.sock PORT=4848 dist/herdr-office &
          pid=$!
          curl -fsS --retry 5 --retry-connrefused -o /dev/null http://127.0.0.1:4848/vendor/three@0.186.1/build/three.core.js
          curl -fsS http://127.0.0.1:4848/ | grep -q office-token
          test "$(dist/herdr-office --version)" = "${HERDR_OFFICE_VERSION#v}"
          kill "$pid"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: dist/herdr-office-linux-x64.tar.gz
          if-no-files-found: error

  mac:
    needs: please
    if: needs.please.outputs.created == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HERDR_OFFICE_VERSION: ${{ needs.please.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm run build
      - run: codesign --verify --strict dist/herdr-office
      - name: Smoke test the binary
        run: |
          HERDR_OFFICE_NO_OPEN=1 HERDR_SOCKET_PATH=/tmp/none.sock PORT=4848 dist/herdr-office &
          pid=$!
          curl -fsS --retry 5 --retry-connrefused -o /dev/null http://127.0.0.1:4848/vendor/three@0.186.1/build/three.core.js
          curl -fsS http://127.0.0.1:4848/ | grep -q office-token
          test "$(dist/herdr-office --version)" = "${HERDR_OFFICE_VERSION#v}"
          kill "$pid"
      - uses: actions/upload-artifact@v7
        with:
          name: darwin-arm64
          path: dist/herdr-office-darwin-arm64.tar.gz
          if-no-files-found: error

  release:
    runs-on: ubuntu-24.04
    needs: [please, linux, mac]
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Upload the files to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.please.outputs.tag }}
        run: gh release upload "$TAG" --clobber dist/*.tar.gz install.sh
