name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm test
      - name: Check install.sh
        run: |
          command -v shellcheck || sudo apt-get install -y shellcheck
          shellcheck install.sh
      - run: npm run build
        env:
          HERDR_OFFICE_VERSION: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: dist/herdr-office-linux-x64.tar.gz
          if-no-files-found: error

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm run build
        env:
          HERDR_OFFICE_VERSION: ${{ github.ref_name }}
      - run: codesign --verify --strict dist/herdr-office
      - uses: actions/upload-artifact@v7
        with:
          name: darwin-arm64
          path: dist/herdr-office-darwin-arm64.tar.gz
          if-no-files-found: error

  release:
    runs-on: ubuntu-24.04
    needs: [linux, mac]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Make the draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --draft
          --repo TheBabaYaga/herdr-office
          --title "$GITHUB_REF_NAME"
          dist/*.tar.gz install.sh
